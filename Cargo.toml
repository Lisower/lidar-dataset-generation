[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94" # Минимальная версия Rust
repository = "https://github.com/Lisower/lidar-dataset-generator"

[workspace.dependencies]
# --- движок ---
bevy = "0.20.0"
bevy_asset = "0.20.0"

# --- случайность и шум ---
rand = "0.10.3"
noise = "0.9.0"

# --- сериализация и ошибки ---
serde = { version = "1", features = ["derive"] }
ron = "0.12"
thiserror = "2.0.21"

# --- инструменты разработки ---
criterion = { version = "0.8.2", features = ["html_reports"] }

# todo: Разобраться с профилями сборки!
# --- Профили сборки (DeepSeek) ---
#
# Цель настройки: разработчик должен получать обратную связь за секунды,
# а не за минуты. Это важнее скорости работы debug-сборки: во время разработки
# человек чаще запускает проверки, чем смотрит на результат.
#
# Замерено на этом проекте: с `opt-level = 3` для зависимостей даже
# `cargo check` без единого изменения исходников занимал 5,5 минуты, и это
# при 23 ГБ каталога `target/`. Для команды из шести человек такой цикл
# неприемлем — поэтому зависимости в dev НЕ оптимизируются.
#
# Если понадобится быстрая demo-сборка с оптимизацией — используйте `--profile dist`.
[profile.dev]
# Свой код тоже без оптимизаций: пересборка после правки должна быть мгновенной.
opt-level = 0
# Отладочная информация ограничена строками: компоновка идёт заметно быстрее,
# а трассировки остаются читаемыми.
debug = "line-tables-only"

[profile.dev.package."*"]
# Осознанный отказ от `opt-level = 3`: именно он превращал проверку в 5 минут.
opt-level = 0
debug = false

# Бенчмарки: зависимости оптимизированы.
[profile.bench]
inherits = "release"
lto = "thin"
